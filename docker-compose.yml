services:
  # === Data Layer ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sca_platform
      POSTGRES_USER: sca_user
      POSTGRES_PASSWORD: sca_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sca_user -d sca_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Backend API ===
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://sca_user:sca_password@postgres:5432/sca_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_WORKSPACE_DIR: /app/workspace
      DEBUG: "true"
      HOST_CODE_DIR_ON_HOST: d:/Code
      WORKSPACE_VOLUME_NAME: sca_scan_workspace

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scan_workspace:/app/workspace
      - ./..:/app/host_code
    restart: unless-stopped

  # === Celery Worker ===
  celery-worker:
    build: ./backend
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=3
    environment:
      DATABASE_URL: postgresql+asyncpg://sca_user:sca_password@postgres:5432/sca_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_WORKSPACE_DIR: /app/workspace
      HOST_CODE_DIR_ON_HOST: d:/Code
      WORKSPACE_VOLUME_NAME: sca_scan_workspace

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scan_workspace:/app/workspace
      - ./..:/app/host_code
    restart: unless-stopped

  # === Frontend ===
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  scan_workspace:
