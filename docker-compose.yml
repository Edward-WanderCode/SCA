services:
  # === Data Layer ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sca_platform
      POSTGRES_USER: sca_user
      POSTGRES_PASSWORD: sca_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sca_user -d sca_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Backend API ===
  backend:
    build: ./backend
    user: root
    environment:
      DATABASE_URL: postgresql+asyncpg://sca_user:sca_password@postgres:5432/sca_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_WORKSPACE_DIR: /app/workspace
      DEBUG: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-secure-random-string-at-least-32-chars}
      HOST_CODE_DIR_ON_HOST: d:/Code
      WORKSPACE_VOLUME_NAME: sca_scan_workspace
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_BOT_COMMAND_THREAD_ID: ${TELEGRAM_BOT_COMMAND_THREAD_ID:-306}
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081
      USE_LOCAL_OPENGREP: "true"
      USE_LOCAL_TRIVY: "true"
      USE_LOCAL_TRUFFLEHOG: "true"
      USE_LOCAL_BANDIT: "true"
      USE_LOCAL_GOSEC: "true"
      PYTHONUNBUFFERED: "1"

    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scan_workspace:/app/workspace
      - ./..:/app/host_code
      - ./backend:/app
    restart: unless-stopped

  # === Celery Worker ===
  celery-worker:
    build: ./backend
    user: root
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=6

    environment:
      DATABASE_URL: postgresql+asyncpg://sca_user:sca_password@postgres:5432/sca_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_WORKSPACE_DIR: /app/workspace
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-secure-random-string-at-least-32-chars}
      HOST_CODE_DIR_ON_HOST: d:/Code
      WORKSPACE_VOLUME_NAME: sca_scan_workspace
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_BOT_COMMAND_THREAD_ID: ${TELEGRAM_BOT_COMMAND_THREAD_ID:-306}
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081
      USE_LOCAL_OPENGREP: "true"
      USE_LOCAL_TRIVY: "true"
      USE_LOCAL_TRUFFLEHOG: "true"
      USE_LOCAL_BANDIT: "true"
      USE_LOCAL_GOSEC: "true"
      PYTHONUNBUFFERED: "1"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scan_workspace:/app/workspace
      - ./..:/app/host_code
      - ./backend:/app
    restart: unless-stopped

  # === Frontend ===
  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # === Local Telegram Bot API Server (2GB Upload/Download limit) ===
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    entrypoint: >
      sh -c '
      if [ -z "$${TELEGRAM_API_ID}" ] || [ "$${TELEGRAM_API_ID}" = "your_telegram_api_id_here" ]; then
        echo "⚠️ TELEGRAM_API_ID not configured in .env. Local Telegram Bot API Server disabled."
        echo "💡 Standard Telegram API (https://api.telegram.org) is active by default."
        tail -f /dev/null
      else
        exec telegram-bot-api --api-id="$${TELEGRAM_API_ID}" --api-hash="$${TELEGRAM_API_HASH}" --local --dir=/var/lib/telegram-bot-api
      fi
      '
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    restart: unless-stopped


volumes:
  postgres_data:
  scan_workspace:
  telegram_bot_api_data:
